<!DOCTYPE html>
<html lang="cs">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Circuits & Biscuits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">

    <section class="section">

        <div id="users-container" class="users-list">
            <p class="loading">Načítání uživatelů...</p>

        <h2>Co pije?</h2>
        <div id="drinks-container" class="drinks-list">

        <button id="odeslat-btn" class="primary-btn">Odeslat</button>
        <p id="status-msg" class="status-msg"></p>
    </div>

<script src="app.js"></script>
